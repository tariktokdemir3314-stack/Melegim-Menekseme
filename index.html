<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Menekşem'e Dokun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #fff1f4;
    --blush: #f7a8c4;
    --plum: #6e2a4f;
    --plum-deep: #4a1942;
    --crimson: #e6003c;
    --rose: #ff8fab;
    --gold: #ffd166;
    --paper: #fffaf9;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; min-height:100%;
    background: radial-gradient(circle at 50% 30%, var(--cream) 0%, var(--blush) 45%, var(--plum) 100%);
    font-family:'Quicksand', sans-serif;
    color: var(--plum-deep);
    overflow-x:hidden;
  }
  .bg-decor{
    position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;
  }
  .bg-decor span{
    position:absolute; bottom:-10%; opacity:0.85; will-change:transform;
    animation-name: floatUp; animation-timing-function: ease-in-out; animation-iteration-count: infinite;
  }
  @keyframes floatUp{
    0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%  { opacity:0.9; }
    90%  { opacity:0.7; }
    100% { transform: translateY(-115vh) translateX(var(--drift,20px)) rotate(25deg); opacity:0; }
  }

  .wrap{
    position:relative; z-index:1;
    max-width: 460px; margin: 0 auto;
    padding: 34px 20px 46px;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    min-height:100vh;
  }
  .title{
    font-family:'Dancing Script', cursive;
    font-weight:700;
    font-size: 2.5rem;
    color: var(--plum-deep);
    margin: 4px 0 2px;
    text-shadow: 0 2px 10px rgba(255,255,255,0.5);
  }
  .subtitle{
    font-size: 0.95rem;
    color: var(--plum-deep);
    opacity:0.8;
    margin: 0 0 22px;
    max-width: 320px;
    line-height:1.5;
  }

  .heart-btn{
    background:none; border:none; padding:0; cursor:pointer;
    width: 220px; height: 200px;
    display:block; margin: 6px auto 14px;
    transition: transform 0.12s ease;
    touch-action: manipulation;
  }
  .heart-btn:active{ transform: scale(0.94); }
  .heart-svg{ width:100%; height:100%; overflow:visible; filter: drop-shadow(0 10px 22px rgba(110,42,79,0.35)); }
  .heart-path.outline{ fill: rgba(255,255,255,0.35); stroke: var(--paper); stroke-width:0.6; }
  .heart-path.fill{ transition: none; }

  .progress-label{
    font-size:0.82rem; letter-spacing:0.02em; color: var(--plum-deep);
    opacity:0.75; margin-bottom:18px;
  }

  .message-card{
    background: var(--paper);
    border-radius: 22px;
    padding: 22px 24px;
    min-height: 92px;
    width:100%;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 12px 30px rgba(110,42,79,0.25);
    margin-bottom: 18px;
  }
  .message-card p{
    margin:0; font-size:1.05rem; font-weight:600; line-height:1.55;
    color: var(--plum-deep);
    opacity:0; transform: translateY(6px);
    animation: msgIn 0.5s ease forwards;
  }
  @keyframes msgIn{ to{ opacity:1; transform:none; } }

  .hint{
    font-size:0.8rem; color: var(--plum-deep); opacity:0.6; margin-top:2px;
  }

  .reset-btn{
    margin-top: 22px;
    font-family:'Quicksand', sans-serif;
    font-weight:700; font-size:0.95rem;
    background: var(--crimson); color:white; border:none;
    padding: 12px 26px; border-radius: 30px; cursor:pointer;
    box-shadow: 0 8px 18px rgba(230,0,60,0.35);
    transition: transform 0.15s ease, opacity 0.3s ease;
  }
  .reset-btn:active{ transform: scale(0.96); }
  .hidden{ opacity:0; pointer-events:none; height:0; margin:0; overflow:hidden; }

  .finale-overlay{
    position:fixed; inset:0; z-index:20;
    background: radial-gradient(circle at 50% 35%, rgba(255,241,244,0.98) 0%, rgba(110,42,79,0.97) 100%);
    display:flex; align-items:center; justify-content:center;
    padding: 30px; text-align:center;
    opacity:0; pointer-events:none;
    transition: opacity 0.6s ease;
  }
  .finale-overlay.show{ opacity:1; pointer-events:auto; }
  .finale-box{
    max-width: 380px;
  }
  .finale-box .big{
    font-family:'Dancing Script', cursive; font-weight:700;
    font-size: 2.4rem; color: var(--plum-deep); margin-bottom: 14px;
    line-height:1.25;
  }
  .finale-box p{
    font-size:1.05rem; font-weight:600; color: var(--plum-deep); line-height:1.6;
    margin: 0 0 22px;
  }
  .finale-close{
    font-family:'Quicksand', sans-serif; font-weight:700; font-size:0.95rem;
    background: var(--plum-deep); color:white; border:none;
    padding: 12px 28px; border-radius: 30px; cursor:pointer;
  }

  .burst-heart{
    position:fixed; z-index:15; pointer-events:none;
    font-size: 20px;
    animation: burstUp 0.9s ease-out forwards;
  }
  @keyframes burstUp{
    0%{ transform: translate(0,0) scale(0.6); opacity:1; }
    100%{ transform: translate(var(--bx,0px), -90px) scale(1.15); opacity:0; }
  }

  @media (max-width: 360px){
    .heart-btn{ width:180px; height:164px; }
    .title{ font-size:2.1rem; }
  }

  @media (prefers-reduced-motion: reduce){
    .bg-decor span, .message-card p, .burst-heart { animation: none !important; }
  }
</style>
</head>
<body>

<div class="bg-decor" id="bgDecor"></div>

<main class="wrap">
  <h1 class="title">Menekşem'e Dokun</h1>
  <p class="subtitle">Kalbe her dokunuşunda küçük bir söz düşecek. Bakalım kalbi doldurabilecek misin?</p>

  <button class="heart-btn" id="heartBtn" aria-label="Kalbe dokun">
    <svg viewBox="0 0 32 29" class="heart-svg">
      <defs>
        <clipPath id="fillClip" clipPathUnits="userSpaceOnUse">
          <rect id="fillRect" x="-2" y="29" width="36" height="0"></rect>
        </clipPath>
        <linearGradient id="heartGrad" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#e6003c"/>
          <stop offset="100%" stop-color="#ff8fab"/>
        </linearGradient>
      </defs>
      <path class="heart-path outline"
        d="M16 29C16 29 0 18.5 0 8.8C0 3.9 3.9 0 8.8 0C12 0 14.5 1.6 16 4C17.5 1.6 20 0 23.2 0C28.1 0 32 3.9 32 8.8C32 18.5 16 29 16 29Z"/>
      <path class="heart-path fill" fill="url(#heartGrad)" clip-path="url(#fillClip)"
        d="M16 29C16 29 0 18.5 0 8.8C0 3.9 3.9 0 8.8 0C12 0 14.5 1.6 16 4C17.5 1.6 20 0 23.2 0C28.1 0 32 3.9 32 8.8C32 18.5 16 29 16 29Z"/>
    </svg>
  </button>

  <div class="progress-label" id="progressLabel">0 / 25 dokunuş</div>

  <div class="message-card">
    <p id="messageText">Hazır mısın Menekşem? Kalbe dokun, bakalım ne çıkacak...</p>
  </div>
  <div class="hint" id="hintText">👆 kalbe dokunmaya devam et</div>

  <button class="reset-btn hidden" id="resetBtn">Baştan başlat</button>
</main>

<div class="finale-overlay" id="finaleOverlay">
  <div class="finale-box">
    <div class="big">Kalbi doldurdun 💗</div>
    <p id="finaleText"></p>
    <button class="finale-close" id="finaleClose">Kapat</button>
  </div>
</div>

<script>
(function(){
  var messages = [
    "Gözlerin gülünce benim de günüm aydınlanıyor Menekşem.",
    "Sen bahçemin en güzel çiçeğisin, adın gibi tek ve özelsin.",
    "Seninle geçen en sıradan an bile benim için özel oluyor.",
    "Menekşem, sesini duymak günümü değiştirmeye yetiyor.",
    "İyi ki hayatıma girdin, iyi ki varsın.",
    "Seni düşünmeden geçen bir saatim bile yok galiba.",
    "Gülüşün, en sevdiğim melodi.",
    "Sana sarılmak, güvende hissettiğim tek yer.",
    "Menekşem, kalbimin en yumuşak köşesi sana ait.",
    "Seninle sessizlik bile anlamlı geliyor.",
    "Bugün de seni ne kadar çok sevdiğimi hatırlamanı istedim.",
    "Yanımda olduğun her an kendimi daha iyi bir insan gibi hissediyorum.",
    "Menekşem, sen benim en güzel tesadüfümsün.",
    "Elini tutmak, dünyanın en huzurlu hissi.",
    "Seninle kurduğum her hayalin içinde gülüyorsun.",
    "Uzakta da olsak kalbim hep senin tarafında atıyor.",
    "Menekşem, sen benim şanslı günümsün.",
    "Gözlerine bakınca zaman durur gibi oluyor.",
    "Sana sarılıp hiçbir şey konuşmadan durabilirim saatlerce.",
    "Seninle güldüğüm anlar, biriktirdiğim en kıymetli hazine.",
    "Menekşem, sen olmadan eksik kalan bir şeyim var hep.",
    "Her sabah seni düşünerek uyanmak istiyorum, biliyorsun değil mi?",
    "Aramızdaki bu bağ, hayatımda hissettiğim en güzel şey.",
    "Seni seviyorum demek bile bazen yetersiz kalıyor Menekşem."
  ];

  var finaleText = "Bu kalbi tıpkı hayatımı doldurduğun gibi doldurdun. İyi ki hayatımdasın, seni çok seviyorum Menekşem.";

  var TARGET = 25;
  var taps = 0;
  var order = [];
  var pointer = 0;
  var finished = false;

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
    }
    return a;
  }

  function nextMessage(){
    if(pointer >= order.length){
      order = shuffle(messages);
      pointer = 0;
    }
    var msg = order[pointer];
    pointer++;
    return msg;
  }

  var fillRect = document.getElementById('fillRect');
  var progressLabel = document.getElementById('progressLabel');
  var messageText = document.getElementById('messageText');
  var heartBtn = document.getElementById('heartBtn');
  var resetBtn = document.getElementById('resetBtn');
  var hintText = document.getElementById('hintText');
  var finaleOverlay = document.getElementById('finaleOverlay');
  var finaleTextEl = document.getElementById('finaleText');
  var finaleClose = document.getElementById('finaleClose');

  function updateFill(){
    var pct = Math.min(1, taps / TARGET);
    var h = pct * 29;
    fillRect.setAttribute('y', 29 - h);
    fillRect.setAttribute('height', h);
  }

  function showMessage(text){
    messageText.style.animation = 'none';
    void messageText.offsetWidth;
    messageText.textContent = text;
    messageText.style.animation = 'msgIn 0.5s ease forwards';
  }

  function spawnBurst(x, y){
    var icons = ['💗','💕','🌸','✨','💖'];
    for(var i=0;i<6;i++){
      var el = document.createElement('div');
      el.className = 'burst-heart';
      el.textContent = icons[Math.floor(Math.random()*icons.length)];
      el.style.left = (x - 10 + (Math.random()*20-10)) + 'px';
      el.style.top = (y - 10) + 'px';
      el.style.setProperty('--bx', (Math.random()*100-50) + 'px');
      document.body.appendChild(el);
      (function(node){
        setTimeout(function(){ node.remove(); }, 950);
      })(el);
    }
  }

  function showFinale(){
    finaleTextEl.textContent = finaleText;
    finaleOverlay.classList.add('show');
  }

  function handleTap(e){
    if(finished) return;

    var rect = heartBtn.getBoundingClientRect();
    var x = rect.left + rect.width/2;
    var y = rect.top + rect.height/2;
    spawnBurst(x, y);

    taps++;
    updateFill();
    progressLabel.textContent = Math.min(taps,TARGET) + ' / ' + TARGET + ' dokunuş';
    showMessage(nextMessage());

    if(taps >= TARGET){
      finished = true;
      hintText.textContent = 'Kalp doldu 💗';
      resetBtn.classList.remove('hidden');
      setTimeout(showFinale, 550);
    }
  }

  heartBtn.addEventListener('click', handleTap);

  resetBtn.addEventListener('click', function(){
    taps = 0;
    finished = false;
    order = shuffle(messages);
    pointer = 0;
    updateFill();
    progressLabel.textContent = '0 / ' + TARGET + ' dokunuş';
    hintText.textContent = '👆 kalbe dokunmaya devam et';
    resetBtn.classList.add('hidden');
    showMessage("Hazır mısın Menekşem? Kalbe dokun, bakalım ne çıkacak...");
  });

  finaleClose.addEventListener('click', function(){
    finaleOverlay.classList.remove('show');
  });

  // background floating decorations
  var bgDecor = document.getElementById('bgDecor');
  var decorIcons = ['🌸','💐','🌷','💗','✨','💕'];
  var n = 16;
  for(var i=0;i<n;i++){
    var s = document.createElement('span');
    s.textContent = decorIcons[Math.floor(Math.random()*decorIcons.length)];
    var left = Math.random()*100;
    var size = 14 + Math.random()*20;
    var duration = 9 + Math.random()*10;
    var delay = Math.random()*10;
    var drift = (Math.random()*80-40) + 'px';
    s.style.left = left + '%';
    s.style.fontSize = size + 'px';
    s.style.animationDuration = duration + 's';
    s.style.animationDelay = '-' + delay + 's';
    s.style.setProperty('--drift', drift);
    bgDecor.appendChild(s);
  }

  order = shuffle(messages);
  updateFill();
})();
</script>
</body>
</html>
